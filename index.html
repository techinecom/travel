<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greenery - Collaborative Travel Platform</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Font Awesome for Icons (for social buttons and menu) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    
    <style>
        /* Custom styles and Tailwind config override */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap');
        
        :root {
            --color-primary: #38a169; /* Tailwind emerald-600 */
            --color-secondary: #f0fff4; /* Tailwind emerald-50 */
            --color-dark: #1e293b; /* Dark slate text */
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--color-secondary);
            color: var(--color-dark);
        }

        /* Styles for the new top-right sidebar menu */
        #sidebar {
            transition: transform 0.3s ease-in-out;
            transform: translateX(100%); /* Hidden by default */
            right: 0;
            top: 0;
            width: 300px;
            z-index: 50;
            box-shadow: -4px 0 10px rgba(0, 0, 0, 0.1);
        }
        #sidebar.open {
            transform: translateX(0);
        }
        #sidebar-overlay {
            z-index: 49;
        }

        /* General UI/UX Styles */
        .ui-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 15px -3px rgba(16, 185, 129, 0.1), 0 4px 6px -4px rgba(16, 185, 129, 0.05);
        }
        .ui-card:hover:not(.no-hover-lift) {
            transform: translateY(-4px);
            box-shadow: 0 20px 25px -5px rgba(16, 185, 129, 0.2), 0 10px 10px -5px rgba(16, 185, 129, 0.04);
        }
        .input-focus:focus {
            border-color: var(--color-primary);
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.3);
        }
        /* Grid and transition styles */
        .grid-item {
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            animation: fadeIn 0.5s ease-out;
        }
        .grid-item:hover {
            transform: scale(1.02);
            box-shadow: 0 15px 25px -5px rgba(56, 161, 105, 0.3);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-up {
            animation: fadeInUp 0.3s ease-out;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .nav-link {
            display: flex; align-items: center; padding: 12px; border-radius: 8px; font-weight: 500;
            transition: background-color 0.15s;
        }
        .nav-link:hover {
            background-color: #d1f7e0; /* Light green hover */
        }
        
        /* Custom input style to match image */
        .auth-input {
            background-color: #e8ffe8; 
            border: none;
            padding: 1rem;
            border-radius: 12px;
            box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.06);
            font-size: 1.1rem;
            color: var(--color-dark);
        }
        .auth-input::placeholder {
            color: #a3a3a3;
        }
        
        /* Custom sign-in button styles */
        .google-btn, .apple-btn {
            padding: 1rem 0;
            font-weight: 600;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.15s;
        }
        .google-btn {
            background-color: white;
            color: var(--color-dark);
            border: 2px solid #e5e7eb;
        }
        .google-btn:hover {
             background-color: #f3f4f6;
        }
        .apple-btn {
            background-color: white;
            color: var(--color-dark);
            border: 2px solid #e5e7eb;
        }
        .apple-btn:hover {
             background-color: #f3f4f6;
        }
        
        /* Background gradient to match image design */
        #auth-page-bg {
             background-image: linear-gradient(to bottom right, #a7f3d0, #34d399, #059669);
             min-height: 100vh;
        }

        /* Animation for the login title */
        @keyframes beat {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.9; }
            100% { transform: scale(1); opacity: 1; }
        }
        .title-animation {
            animation: beat 2s infinite ease-in-out;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <!-- Sidebar Menu (Top Right) -->
    <aside id="sidebar" class="fixed h-full bg-white p-6 flex flex-col space-y-8 z-50">
        <div class="flex items-center justify-between pb-4 border-b border-green-100">
            <h1 class="text-2xl font-bold text-green-700">Menu</h1>
            <button onclick="closeSidebar()" class="text-gray-500 hover:text-gray-700 focus:outline-none">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>

        <nav class="flex flex-col space-y-2 flex-1">
            <a href="#" class="nav-link" onclick="changeView('home'); closeSidebar();">
                <svg class="w-6 h-6 mr-3 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l-7-7-7 7m10-10v10a1 1 0 01-1 1h-3m-6 0h6m-6 0v-4a1 1 0 011-1h2a1 1 0 011 1v4m-6 0h6"></path></svg>
                Home
            </a>
            <a href="#" class="nav-link" onclick="changeView('dashboard'); closeSidebar();">
                <svg class="w-6 h-6 mr-3 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M12 16h.01"></path></svg>
                Dashboard (Trips)
            </a>
            <a href="#" class="nav-link" onclick="changeView('created_rooms'); closeSidebar();">
                <svg class="w-6 h-6 mr-3 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v3m0 0v3m0-3h3m-3 0H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                My Rooms
            </a>
            <a href="#" class="nav-link" onclick="changeView('history'); closeSidebar();">
                <svg class="w-6 h-6 mr-3 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                Trip History
            </a>
            <a href="#" class="nav-link" onclick="changeView('profile'); closeSidebar();">
                <svg class="w-6 h-6 mr-3 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                Profile
            </a>
        </nav>
        
        <!-- Sign Out Button -->
        <button id="sign-out-btn" onclick="handleSignOut()" class="w-full py-3 bg-red-500 text-white font-bold rounded-lg hover:bg-red-600 transition duration-150">
            Sign Out
        </button>
    </aside>
    <!-- Overlay for closing sidebar -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-black bg-opacity-50 hidden z-40" onclick="closeSidebar()"></div>

    <!-- Main Content Area -->
    <div id="main-content-area" class="flex-1 transition-all duration-300">
        
        <!-- Top Navbar/Header -->
        <header class="bg-white shadow-md p-4 lg:p-6 sticky top-0 z-30 flex items-center justify-between">
            
            <!-- Logo / Back Button Container -->
            <div class="flex items-center space-x-4">
                <button id="back-button" onclick="window.changeView('home')" 
                        class="hidden p-2 text-gray-500 rounded-lg hover:bg-gray-100 focus:outline-none">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                </button>
                <h2 id="main-title" class="text-xl lg:text-2xl font-semibold text-green-800">Home</h2>
            </div>

            <!-- User/Menu Button -->
            <div class="flex items-center space-x-2">
                <span class="text-sm font-medium text-gray-600" id="current-user-name">Guest User</span>
                <button onclick="openSidebar()" class="p-2 rounded-lg hover:bg-gray-100 focus:outline-none">
                    <svg class="w-6 h-6 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                </button>
            </div>
        </header>

        <!-- Dynamic Content Container -->
        <main id="content-container" class="p-4 lg:p-8 flex-1">
            <!-- Content will be injected here by JavaScript routing -->
        </main>
    </div>
    
    <!-- Status Message Banner (Global) -->
    <div id="status-message" class="fixed bottom-4 left-1/2 transform -translate-x-1/2 p-3 rounded-xl shadow-lg font-medium text-sm transition-opacity duration-500 hidden opacity-0 z-50">
        Operation successful.
    </div>

    <!-- Hidden Modal for Messages and Join Confirmation -->
    <div id="message-modal" class="fixed inset-0 bg-gray-900 bg-opacity-50 hidden items-center justify-center z-50">
        <div id="modal-content" class="p-6">
            <!-- Content injected by showMessage or handleJoinRoom -->
        </div>
    </div>
    
    <!-- CUSTOM WELCOME ANIMATION (REMOVED) -->
    <div id="initial-loader" class="hidden"></div>


    <!-- START OF JAVASCRIPT AND FIREBASE INTEGRATION -->
    <!-- NOTE: Scripts moved to the bottom of the body for faster initial page load -->
    <script type="module">
        // --- FIREBASE CORE, FIRESTORE, AND AUTH ---
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, onSnapshot, collection, serverTimestamp, updateDoc, setLogLevel } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Set Firebase Log Level to Debug
        setLogLevel('Debug');

        // --- FALLBACK CONFIGURATION (Provided by User) ---
        const FALLBACK_FIREBASE_CONFIG = {
            apiKey: "AIzaSyB-0ifRN2Ksb4V3D4qF-bwGMurZyjZfxVY",
            authDomain: "travelling-f16c8.firebaseapp.com",
            projectId: "travelling-f16c8",
            storageBucket: "travelling-f16c8.firebasestorage.app",
            messagingSenderId: "55903617203",
            appId: "1:55903617203:web:95f3cb73d39d65fd08b0c6",
            measurementId: "G-TC5X615FDV"
        };
        // --------------------------------------------------

        // --- GLOBAL STATE & IDENTITY ---
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

        let db, auth;
        let userId = null;
        let userName = 'Guest';
        
        const state = {
            currentPage: 'home', // START DIRECTLY ON HOME PAGE
            selectedTripId: null,     
            currentRoomId: null,      
            currentRoomData: null,    
            collaborators: new Map(),
            
            userName: userName,
            phoneNumber: null, 
            allLiveRooms: [], 
            
            isSigningUp: true, // true for "Create Account", false for "Sign In"
            pendingAction: null, 
            pendingActionArgs: [],
        };

        // DOM Elements - Defined with let and assigned in initDOM() on window.onload
        let statusMessageEl = null; 
        
        function initDOM() {
            statusMessageEl = document.getElementById('status-message');
            document.getElementById('sign-out-btn').style.display = 'none'; // Hide sign out initially
        }

        // --- MOCK TEMPLATE DATA ---
        const mockTripTemplates = [
            { id: 'TPL001', title: 'Norwegian Fjords Kayak', description: 'A 7-day paddle adventure through deep blue waters and towering cliffs.', days: 7, price: 1500, cover: 'https://placehold.co/600x400/065f46/ffffff?text=Fjords+Kayac' },
            { id: 'TPL002', title: 'Peruvian Andes Trek', description: 'Explore ancient Inca trails and high-altitude villages. Includes Machu Picchu.', days: 12, price: 2800, cover: 'https://placehold.co/600x400/365314/ffffff?text=Andes+Trek' },
            { id: 'TPL003', title: 'Kyoto Zen Garden Retreat', description: 'A slow-paced cultural journey through temples, tea ceremonies, and exquisite gardens.', days: 5, price: 1200, cover: 'https://placehold.co/600x400/84cc16/ffffff?text=Kyoto+Retreat' },
            { id: 'TPL004', title: 'Patagonia Glacier Cruise', description: 'Discover the vast, icy landscapes of Southern Argentina and Chile by expedition ship.', days: 10, price: 3500, cover: 'https://placehold.co/600x400/0d9488/ffffff?text=Glacier+Cruise' },
            { id: 'TPL005', title: 'Sahara Desert Overland', description: '4-day camel trek and camping under the stars in the Moroccan Sahara.', days: 4, price: 850, cover: 'https://placehold.co/600x400/a3e635/000000?text=Sahara+Desert' },
            { id: 'TPL006', title: 'New Zealand Wine & Coast', description: 'Driving tour focusing on Marlborough vineyards and the rugged South Island coast.', days: 9, price: 2100, cover: 'https://placehold.co/600x400/15803d/ffffff?text=NZ+Wine+Tour' },
        ];
        
        const getTemplateById = (id) => mockTripTemplates.find(t => t.id === id);


        // --- FIREBASE INITIALIZATION ---
        
        async function initFirebase() {
            const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;
            let config = firebaseConfig || FALLBACK_FIREBASE_CONFIG;

            // 1. Skip animation and load UI immediately
            document.getElementById('main-content-area').classList.remove('hidden');
            renderApp(); 
            
            // 2. Initialize Firebase in the background
            try {
                const app = initializeApp(config);
                db = getFirestore(app);
                auth = getAuth(app); 
                
                // --- Auth State Listener ---
                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        userId = user.uid;
                        userName = user.displayName || user.email.split('@')[0];
                        state.userName = userName;
                        
                        document.getElementById('current-user-name').textContent = userName;
                        document.getElementById('auth-status-indicator').classList.replace('bg-gray-400', 'bg-emerald-500');
                        document.getElementById('sign-out-btn').style.display = 'block';

                        // Execute pending action (Host or Join) if redirected after login
                        if (state.pendingAction) {
                            const action = state.pendingAction;
                            const args = state.pendingActionArgs;
                            state.pendingAction = null;
                            state.pendingActionArgs = [];
                            
                            if (action === 'host') {
                                handleHostTrip(...args);
                            } else if (action === 'join') {
                                handleJoinRoom(...args);
                            }
                        }
                    } else {
                        // User is signed out
                        userId = null;
                        userName = 'Guest';
                        state.userName = userName;
                        document.getElementById('current-user-name').textContent = userName;
                        document.getElementById('auth-status-indicator').classList.replace('bg-emerald-500', 'bg-gray-400');
                        document.getElementById('sign-out-btn').style.display = 'none';
                    }
                    
                    // Always listen and render, regardless of user status
                    listenForTrips();
                    renderApp(); // Final clean render
                });
                
            } catch (error) {
                console.error("Firebase Initialization Failed:", error);
                showStatus("Error: Core features may be disabled due to failed initialization.", true);
            }
        }
        
        // --- AUTH ACTIONS (Email/Password and Google) ---

        window.toggleAuthMode = function(isSignUp) {
            state.isSigningUp = isSignUp;
            renderApp();
        }
        
        window.handleFormSubmit = async function(event) {
            event.preventDefault();
            const email = document.getElementById('email-input').value;
            const password = document.getElementById('password-input').value;
            
            if (!email || !password) {
                showMessage("Please enter both email and password.", true);
                return;
            }
            
            if (state.isSigningUp) {
                handleEmailSignUp(email, password);
            } else {
                handleEmailSignIn(email, password);
            }
        }
        
        window.handleEmailSignUp = async function(email, password) {
            showStatus("Creating account...");
            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                
                const user = userCredential.user;
                 // Set basic profile details
                const profileRef = doc(db, `artifacts/${appId}/users/${user.uid}/profile/details`);
                await setDoc(profileRef, {
                    userName: user.email.split('@')[0],
                    email: user.email,
                    dateLastLogin: serverTimestamp()
                }, { merge: true });

                showStatus("Account created successfully! Redirecting...", false);
                // onAuthStateChanged will handle the final state update
                changeView('dashboard');

            } catch (error) {
                console.error("Email Sign Up Failed:", error);
                // Check if the error is due to authentication being disabled
                if (error.code === 'auth/unauthorized-domain' || error.code === 'auth/admin-restricted-operation' || error.code === 'auth/email-already-in-use') {
                     showMessage(`Sign Up Failed: ${error.message}. Ensure Email/Password is enabled in your Firebase Console.`, true);
                } else {
                     showMessage(`Sign Up Failed: ${error.message}`, true);
                }
            }
        }
        
        window.handleEmailSignIn = async function(email, password) {
            showStatus("Signing in...");
            try {
                await signInWithEmailAndPassword(auth, email, password);
                
                showStatus("Signed in successfully! Redirecting...", false);
                // onAuthStateChanged will handle the final state update
                changeView('dashboard');
            } catch (error) {
                console.error("Email Sign In Failed:", error);
                showMessage(`Sign In Failed: ${error.message}`, true);
            }
        }


        window.handleGoogleSignIn = async function() {
            showStatus("Attempting Google Sign In...");

            try {
                const provider = new GoogleAuthProvider();
                const result = await signInWithPopup(auth, provider);
                
                const user = result.user;
                // Save profile details upon first sign-in (simplified for now)
                const profileRef = doc(db, `artifacts/${appId}/users/${user.uid}/profile/details`);
                await setDoc(profileRef, {
                    userName: user.displayName || user.email.split('@')[0],
                    email: user.email,
                    dateLastLogin: serverTimestamp()
                }, { merge: true });
                
                showStatus("Signed in successfully with Google!", false);
                changeView('dashboard');

            } catch (error) {
                if (error.code !== 'auth/popup-closed-by-user') {
                    console.error("Google Sign In Failed:", error);
                    // Check if the error is due to authentication being disabled
                    if (error.code === 'auth/unauthorized-domain') {
                         showMessage(`Sign In Failed: Firebase needs its Authorized Domain whitelisted in your console settings (e.g., 'localhost', '127.0.0.1').`, true);
                    } else {
                         showMessage(`Sign In Failed: ${error.message}`, true);
                    }
                }
            }
        }
        
        window.handleSignOut = async function() {
            try {
                await signOut(auth);
                showStatus("Successfully signed out.", false);
                changeView('home');
            } catch (error) {
                console.error("Sign Out Failed:", error);
                showStatus(`Sign Out Failed: ${error.message}`, true);
            }
        }

        /**
         * Checks if the user is signed in. If not, sets the pending action and redirects to Home (Sign-in page).
         */
        async function ensureAuthenticated(action, ...args) {
            if (userId) {
                return true;
            }

            // Store the intended action
            state.pendingAction = action;
            state.pendingActionArgs = args;
            
            // Redirect to the new Home page/Auth form
            changeView('home'); 
            showStatus("Please sign in or create an account to proceed.", true);
            
            return false;
        }

        // --- SIDEBAR UI HANDLERS ---
        window.openSidebar = function() {
            document.getElementById('sidebar').classList.add('open');
            document.getElementById('sidebar-overlay').classList.remove('hidden');
        }

        window.closeSidebar = function() {
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('sidebar-overlay').classList.add('hidden');
        }


        // --- Firestore Listeners and Data Access ---
        
        let unsubscribeRoomListener = null;

        function getHostedRoomPath(roomId) {
            return doc(db, `artifacts/${appId}/public/data/hosted_rooms/${roomId}`);
        }

        function getLiveRoomsCollectionRef() {
            return collection(db, `artifacts/${appId}/public/data/hosted_rooms`);
        }


        function listenForTrips() {
            if (!db) return; 
            const roomsRef = getLiveRoomsCollectionRef();
            onSnapshot(roomsRef, (snapshot) => {
                state.allLiveRooms = [];
                snapshot.forEach(doc => {
                    const roomData = doc.data();
                    const ageLimit = 7 * 24 * 60 * 60 * 1000; // 7 days in ms
                    const isRecent = roomData.dateCreated && roomData.dateCreated.toMillis() > (Date.now() - ageLimit);

                    // Only show rooms if user is signed in
                    if (userId) {
                         state.allLiveRooms.push({ id: doc.id, ...roomData });
                    }
                });
                if (state.currentPage === 'dashboard') {
                    renderApp();
                }
            }, (error) => {
                console.error("Error listening to live rooms:", error);
            });
        }
        
        function setupRealtimeListeners(roomId) {
             if (!db || !roomId) return;
             
             if (unsubscribeRoomListener) {
                 unsubscribeRoomListener();
             }

            const roomDocRef = getHostedRoomPath(roomId);
            
            // Listener for the active Room Document
            unsubscribeRoomListener = onSnapshot(roomDocRef, (docSnapshot) => {
                const data = docSnapshot.data();
                if (data) {
                    state.currentRoomData = data;
                    state.collaborators = new Map(Object.entries(data.collaborators || {}));
                } else {
                    state.collaborators = new Map();
                    state.currentRoomData = null;
                }
                
                if (state.currentPage === 'host_room') {
                    renderApp(); 
                }
            }, (error) => {
                console.error("Error listening to trip room:", error);
                showStatus(`Error fetching room data: ${error.message}`, true);
            });
        }


        // --- FIREBASE ACTIONS (REQUIRES AUTH) ---
        
        window.handleHostTripCheck = async function(templateId) {
            if (await ensureAuthenticated('host', templateId)) {
                handleHostTrip(templateId); 
            }
        }

        window.handleHostTrip = async function(templateId) {
            
            if (!userId) {
                return ensureAuthenticated('host', templateId); 
            }
            
            showStatus("Setting up your collaboration room...");

            try {
                const template = getTemplateById(templateId);

                // Generate Custom ID
                const namePart = state.userName.toUpperCase().replace(/[^A-Z]/g, '').substring(0, 5).padEnd(5, 'X');
                const phonePart = userId.substring(0, 3).toUpperCase();
                const titlePart = template.title.toUpperCase().replace(/[^A-Z]/g, '').substring(0, 4).padEnd(4, 'X');
                
                const newRoomId = `${namePart}-${phonePart}-${titlePart}`;
                
                // Create the main Room document in Firestore
                const roomRef = getHostedRoomPath(newRoomId);
                await setDoc(roomRef, {
                    templateId: templateId,
                    title: template.title,
                    hostId: userId, 
                    hostName: state.userName,
                    dateCreated: serverTimestamp(),
                    collaborators: { 
                        [userId]: { 
                            name: state.userName, 
                            status: 'Paid', 
                            dateJoined: serverTimestamp() 
                        } 
                    } 
                });
                
                // Instead of jumping to the room, jump to the share view now
                changeView('trip_share', templateId, newRoomId); 
                showStatus(`Trip successfully hosted! Share ID: ${newRoomId}`);

            } catch (e) {
                console.error("Error hosting trip:", e);
                showStatus(`Failed to host trip: ${e.message}`, true);
            }
        };

        window.handleJoinRoomCheck = async function(roomId) {
            if (await ensureAuthenticated('join', roomId)) {
                handleJoinRoom(roomId); 
            }
        }

        window.handleJoinRoom = async function(roomId) {
            
            if (!userId) {
                return ensureAuthenticated('join', roomId);
            }
            
            try {
                const roomRef = getHostedRoomPath(roomId);
                const roomSnap = await getDoc(roomRef);

                if (!roomSnap.exists()) {
                    showStatus(`Room ID ${roomId} not found.`, true);
                    return;
                }

                const roomData = roomSnap.data();
                const template = getTemplateById(roomData.templateId);
                
                if (!template) {
                    showStatus("Error: Trip template details not found.", true);
                    return;
                }
                
                // If user is already a collaborator, take them directly to the room
                if (roomData.collaborators && roomData.collaborators[userId]) {
                     changeView('host_room', roomData.templateId, roomId);
                     showStatus(`Welcome back to Room ${roomId}!`);
                     return;
                }
                
                // Display the share confirmation view for joining
                changeView('trip_share', roomData.templateId, roomId);
            
            } catch (e) {
                console.error("Error joining room:", e);
                showStatus(`Error joining room: ${e.message}`, true);
            }
        };
        
        window.confirmJoinRoom = async function(roomId, templateId) {
            window.closeModal(); 

            try {
                const roomRef = getHostedRoomPath(roomId);

                const newCollaborator = { name: state.userName, status: 'Pending', dateJoined: serverTimestamp() };
                
                await updateDoc(roomRef, {
                    [`collaborators.${userId}`]: newCollaborator
                });
                showStatus(`Successfully joined room ${roomId}!`);
                
                changeView('host_room', templateId, roomId);

            } catch (e) {
                console.error("Error during join confirmation:", e);
                showStatus(`Failed to complete join: ${e.message}`, true);
            }
        }


        window.handleUpdateCollaboratorStatus = async function(roomId, collaboratorId, newStatus) {
            
            if (!userId) {
                showStatus("Error: Must be signed in to perform this action.", true);
                return;
            }

            // Check if the current user ID matches the Host ID in the room data.
            if (state.currentRoomData?.hostId !== userId) {
                showStatus("Error: Only the room creator (Host) can update payment status.", true);
                return;
            }
            if (collaboratorId === userId) {
                showStatus("Error: Cannot change your own status.", true);
                return;
            }

            showStatus(`Updating status for ${collaboratorId.substring(0, 8)}... to ${newStatus}...`);

            try {
                const roomRef = getHostedRoomPath(roomId);
                await updateDoc(roomRef, {
                    [`collaborators.${collaboratorId}.status`]: newStatus
                });
                showStatus("Status updated successfully!");

            } catch (e) {
                console.error("Error updating collaborator status:", e);
                showStatus(`Failed to update status: ${e.message}`, true);
            }
        };
        
        // --- UI/UX & UTILITY FUNCTIONS ---
        
        window.closeModal = function() {
            document.getElementById('message-modal').classList.add('hidden');
            document.getElementById('message-modal').classList.remove('flex');
            document.getElementById('modal-content').innerHTML = `
                <p id="modal-message" class="text-lg font-semibold text-gray-800 mb-4"></p>
                <button id="modal-ok-button" onclick="window.closeModal()"
                        class="px-4 py-2 bg-green-500 text-white font-medium rounded-lg hover:bg-green-600 transition duration-150">
                    OK
                </button>
            `;
        }

        function showStatus(message, isError = false) {
            if (!statusMessageEl) {
                console.error("showStatus called but statusMessageEl is null. Skipping message.");
                return;
            }
            statusMessageEl.textContent = message;
            statusMessageEl.classList.remove('hidden', 'opacity-0', 'bg-red-100', 'text-red-800', 'bg-emerald-100', 'text-emerald-800');
            statusMessageEl.classList.add('opacity-100');

            if (isError) {
                statusMessageEl.classList.add('bg-red-100', 'text-red-800');
            } else {
                statusMessageEl.classList.add('bg-emerald-100', 'text-emerald-800');
            }

            setTimeout(() => {
                statusMessageEl.classList.remove('opacity-100');
                statusMessageEl.classList.add('opacity-0');
                setTimeout(() => statusMessageEl.classList.add('hidden'), 500);
            }, 4000);
        }

        window.showMessage = function(message, isError = false) {
            const modal = document.getElementById('message-modal');
            const modalContent = document.getElementById('modal-content');

            const statusClass = isError ? 'bg-red-100 text-red-700' : 'bg-green-100 text-green-700';
            const buttonClass = isError ? 'bg-red-500 hover:bg-red-600' : 'bg-green-500 hover:bg-green-600';

            modalContent.innerHTML = `
                <div class="bg-white p-6 rounded-xl shadow-2xl max-w-sm w-full text-center">
                    <div class="p-3 mb-4 rounded-lg ${statusClass}">
                        <p id="modal-message" class="text-lg font-semibold">${message}</p>
                    </div>
                    <button onclick="window.closeModal()"
                            class="px-4 py-2 ${buttonClass} text-white font-medium rounded-lg transition duration-150">
                        OK
                    </button>
                </div>
            `;
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        window.copyToClipboard = function(text) {
             const tempInput = document.createElement('input');
             document.body.appendChild(tempInput);
             tempInput.value = text;
             tempInput.select();
             
             try {
                document.execCommand('copy');
                showStatus('Copied ID to clipboard!');
             } finally {
                document.body.removeChild(tempInput);
             }
        }

        window.handleSearchOrJoin = async function(event) {
            event.preventDefault();
            const searchInput = document.getElementById('trip-search-id');
            const id = searchInput.value.trim().toUpperCase(); // Normalize ID
            searchInput.value = ''; // Clear input after search

            if (!id) {
                showStatus("Please enter a Room ID.", true);
                return;
            }

            handleJoinRoomCheck(id);
        };
        
        // --- CORE VIEW SWITCHING AND ROUTING ---

        window.changeView = function(viewName, tripId = null, roomId = null) {

            if (roomId && roomId !== state.currentRoomId) {
                state.currentRoomId = roomId;
                setupRealtimeListeners(roomId); 
            } else if (viewName !== 'host_room' && viewName !== 'trip_share') {
                if (unsubscribeRoomListener) {
                    unsubscribeRoomListener(); 
                    unsubscribeRoomListener = null;
                }
                state.currentRoomId = null; 
                state.currentRoomData = null; 
            }

            state.currentPage = viewName;
            state.selectedTripId = tripId;
            renderApp();
        };

        function renderApp(withZoom = false) {
            
            document.getElementById('content-container').innerHTML = ''; // Clear for injection
            
            // Handle active class for navigation
            document.querySelectorAll('.nav-link').forEach(link => {
                const linkPageMatch = link.getAttribute('onclick').match(/changeView\('([^']+)'/);
                const linkPage = linkPageMatch ? linkPageMatch[1] : null;
                if (linkPage === state.currentPage) {
                    link.classList.add('bg-emerald-50');
                } else {
                    link.classList.remove('bg-emerald-50');
                }
            });

            const mainTitleEl = document.getElementById('main-title');
            let pageTitle = state.currentPage.charAt(0).toUpperCase() + state.currentPage.slice(1).replace(/([A-Z])/g, ' $1');
            
            if (state.currentPage === 'host_room' && state.currentRoomData) {
                pageTitle = `Room: ${state.currentRoomData.title}`;
            } else if (state.currentPage === 'trip_share') {
                pageTitle = `Trip Share Preview`;
            }
            if (mainTitleEl) mainTitleEl.textContent = pageTitle;

            const backButton = document.getElementById('back-button');
            if (backButton) {
                // Back button visible everywhere except home screen
                if (state.currentPage !== 'home') {
                    backButton.classList.remove('hidden');
                } else {
                    backButton.classList.add('hidden');
                }
            }
            
            // Set Sign Out Button Visibility
            document.getElementById('sign-out-btn').style.display = userId ? 'block' : 'none';

            // Render Main Content
            switch (state.currentPage) {
                case 'loading':
                    // We render the HTML outside the content container
                    break;
                case 'home':
                    // Pass the zoom flag to the home render function
                    document.getElementById('content-container').innerHTML = renderHomePage(withZoom);
                    break;
                case 'dashboard':
                    document.getElementById('content-container').innerHTML = renderDashboardView();
                    break;
                case 'trip_details':
                    document.getElementById('content-container').innerHTML = renderTripDetailsView();
                    break;
                case 'host_room':
                    document.getElementById('content-container').innerHTML = renderHostRoomView();
                    break;
                case 'trip_share':
                    document.getElementById('content-container').innerHTML = renderTripShareView();
                    break;
                default:
                    // For other placeholder pages, use simple rendering
                    document.getElementById('content-container').innerHTML = renderSimplePage(pageTitle, `Content for the ${pageTitle} management section goes here.`);
            }
            
            // Update bottom status bar (runs always)
            document.getElementById('current-user-name').textContent = state.userName;
        }

                            <p class="text-3xl font-bold text-gray-800 mb-2">${actionText}</p>
                            <p class="text-xl italic text-emerald-700 font-serif mb-6">"${quote}"</p>

                            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 p-6 mb-8 bg-emerald-50 rounded-xl border border-emerald-200">
                                <div><p class="text-sm text-gray-600">Days</p><p class="text-2xl font-bold text-gray-900">${template.days}</p></div>
                                <div><p class="text-sm text-gray-600">Price</p><p class="text-2xl font-bold text-emerald-600">$${template.price}</p></div>
                                <div><p class="text-sm text-gray-600">Room ID</p><p class="text-2xl font-bold text-gray-900 font-mono">${state.currentRoomId}</p></div>
                            </div>
                            
                            <!-- Detailed Description -->
                            <p class="text-lg text-gray-700 mb-8 max-w-2xl mx-auto">${template.description}</p>


                            <!-- Call to Action -->
                            <button onclick="changeView('host_room', state.selectedTripId, state.currentRoomId)"
                                class="ui-button py-4 px-10 bg-emerald-500 text-white text-lg font-bold rounded-xl hover:bg-emerald-600 transition duration-150 shadow-xl shadow-emerald-300 inline-flex items-center justify-center">
                                <i class="fas fa-handshake mr-3"></i> ${joinButtonText}
                            </button>
                            
                            <!-- Share Link Box (Only visible if hosted) -->
                            ${isHost ? `
                                <div class="mt-8 pt-4 border-t border-gray-100">
                                    <p class="text-md font-semibold text-gray-700 mb-3">Copy & Share This Exclusive Link:</p>
                                    <div class="flex max-w-sm mx-auto items-center">
                                        <input type="text" readonly value="${state.currentRoomId}" id="room-link"
                                            class="flex-grow px-3 py-2 text-sm bg-gray-100 rounded-l-lg border border-gray-300 font-mono" />
                                        <button onclick="copyToClipboard(document.getElementById('room-link').value)" 
                                            class="ui-button p-3 bg-emerald-500 hover:bg-emerald-600 text-white rounded-r-lg" title="Copy ID">
                                            <i class="fas fa-copy"></i>
                                        </button>
                                    </div>
                                </div>
                            ` : ''}

                        </div>
                    </div>
                </div>
            `;
        }


        // 3. HOST ROOM VIEW (COLLABORATIVE ITINERARY)
        function renderHostRoomView() {

            if (!state.currentRoomId || !state.currentRoomData) { 
                return `<div class="p-8 text-center text-red-500">Error: Room data is missing or loading. Please ensure the room ID is correct and try again.</div>`;
            }

            const roomData = state.currentRoomData;
            const template = getTemplateById(roomData.templateId);

            const tripDescription = template 
                ? `${template.description} (${template.days} Days, $${template.price})` 
                : "Template details loading...";
                
            const shareLink = state.currentRoomId; 
            const isHost = roomData.hostId === userId;
            
            // Collaborator Table Logic
            const collaboratorsArray = Array.from(state.collaborators.entries()).map(([uId, collabData]) => ({
                id: uId,
                name: collabData.name,
                status: collabData.status,
                dateJoined: collabData.dateJoined
            }));

            const collaboratorRows = collaboratorsArray.map(collab => {
                const isMe = collab.id === userId;
                const status = collab.status;
                let statusClass, statusText;

                if (status === 'Paid') {
                    statusClass = 'bg-green-100 text-green-700';
                    statusText = 'Paid';
                } else if (status === 'Partial') {
                    statusClass = 'bg-yellow-100 text-yellow-700';
                    statusText = 'Partial';
                } else {
                    statusClass = 'bg-red-100 text-red-700';
                    statusText = 'Pending';
                }

                let actionsHTML = '';
                if (isHost) {
                    if (isMe) {
                        actionsHTML = `<td class="px-6 py-4 whitespace-nowrap text-sm text-gray-400">Host (Full Access)</td>`;
                    } else {
                        actionsHTML = `
                            <td class="px-6 py-4 whitespace-nowrap text-sm">
                                <select onchange="handleUpdateCollaboratorStatus('${state.currentRoomId}', '${collab.id}', this.value)"
                                    class="p-2 border border-gray-300 rounded-lg bg-white focus:ring-emerald-500 focus:border-emerald-500 text-gray-700">
                                    <option value="Pending" ${status === 'Pending' ? 'selected' : ''}>Pending</option>
                                    <option value="Partial" ${status === 'Partial' ? 'selected' : ''}>Partial</option>
                                    <option value="Paid" ${status === 'Paid' ? 'selected' : ''}>Paid</option>
                                </select>
                            </td>`;
                    }
                } else {
                    actionsHTML = `<td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">View Only</td>`;
                }
                
                return `
                    <tr class="border-b border-gray-100 hover:bg-gray-50 transition duration-100">
                        <td class="px-6 py-4 text-sm font-medium text-gray-900">
                            ${collab.name} ${isMe ? '<span class="text-xs font-semibold text-emerald-500">(You)</span>' : ''}
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <span class="px-3 py-1 inline-flex text-xs leading-5 font-semibold rounded-full ${statusClass}">
                                ${statusText}
                            </span>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                            ${(collab.dateJoined && collab.dateJoined.toDate) ? collab.dateJoined.toDate().toLocaleDateString() : 'Unknown'}
                        </td>
                        ${actionsHTML}
                    </tr>
                `;
            }).join('');
            
            const emptyState = `
                <div class="text-center py-16 border-2 border-dashed border-emerald-200 rounded-xl bg-emerald-50">
                    <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="text-emerald-400 mx-auto mb-4"><circle cx="12" cy="12" r="10"/><path d="M12 5v14M5 12h14"/></svg>
                    <p class="text-xl text-gray-600 font-bold">No collaborators have joined yet!</p>
                    <p class="text-gray-500 mt-2">Share the ID above to get your friends involved.</p>
                </div>
            `;


            return `
                <!-- Top Info Card: Trip Context -->
                <div class="bg-white p-6 rounded-xl shadow-xl border-t-4 border-emerald-500 mb-8">
                    <h2 class="text-3xl font-extrabold text-gray-900 mb-2">${roomData.title}</h2>
                    <p class="text-md text-emerald-600 font-semibold mb-4">Hosted Room ID: <span class="font-mono">${state.currentRoomId}</span></p>
                    <p class="text-gray-700">${tripDescription}</p>
                    <button onclick="changeView('trip_share', state.selectedTripId, state.currentRoomId)" class="mt-4 text-emerald-600 hover:text-emerald-700 font-semibold">
                        View Share Preview &raquo;
                    </button>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 pb-20">
                    
                    <!-- Left Column: Share Link -->
                    <div class="lg:col-span-1 space-y-8">
                        <div class="bg-white p-6 rounded-xl ui-card">
                            <h2 class="text-2xl font-bold text-emerald-700 mb-4">Share This Room</h2>
                            <p class="text-sm text-gray-600 mb-3">Send this unique ID to collaborators to join your planning session:</p>
                            <div class="flex items-center space-x-2">
                                <input type="text" readonly value="${shareLink}" id="room-link"
                                    class="flex-grow px-3 py-2 text-sm bg-gray-100 rounded-lg border border-gray-300 font-mono" />
                                <button onclick="copyToClipboard(document.getElementById('room-link').value)" 
                                    class="ui-button p-2 bg-emerald-500 hover:bg-emerald-600 text-white rounded-lg" title="Copy ID">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 012 2v1"/></svg>
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Right Column: Collaborator List Table -->
                    <div class="lg:col-span-2">
                        <div class="bg-white p-6 rounded-xl ui-card min-h-full">
                            <h2 class="text-3xl font-bold text-gray-800 mb-6">Room Members (${collaboratorsArray.length})</h2>
                            
                            <div class="overflow-x-auto">
                                ${collaboratorRows.length > 0 ? `
                                <table class="min-w-full divide-y divide-gray-200">
                                    <thead class="bg-gray-50">
                                        <tr>
                                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Member</th>
                                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Payment Status</th>
                                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Joined On</th>
                                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">${isHost ? 'Actions' : 'Host Status'}</th>
                                        </tr>
                                    </thead>
                                    <tbody class="bg-white divide-y divide-gray-200">
                                        ${collaboratorRows}
                                    </tbody>
                                </table>
                                `: emptyState}
                            </div>
                            <button onclick="changeView('dashboard')" class="mt-8 text-gray-500 hover:text-gray-700 font-semibold flex items-center">
                                &laquo; Back to Dashboard
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderSimplePage(title, content) {
            return `
                <div class="bg-white p-8 rounded-xl shadow-lg border border-gray-100 pb-4">
                    <h2 class="text-3xl font-bold text-green-700 mb-4">${title}</h2>
                    <p class="text-gray-600">${content}</p>
                    <div class="mt-6 p-4 bg-green-50 rounded-lg text-green-700">
                        <p class="font-medium">Placeholder Content:</p>
                        <p class="text-sm">This section is navigable via the bottom bar.</p>
                    </div>
                </div>
            `;
        }


        // --- INITIALIZATION ---

        window.onload = () => {
            initDOM();
            initFirebase();
            // renderApp() is called inside initFirebase after the transition
        };

    </script>
</body>
</html>
